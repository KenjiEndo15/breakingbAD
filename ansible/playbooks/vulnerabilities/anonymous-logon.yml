- name: Anonymous Logon special group inside the Pre-Windows 2000 Compatible Access group
  hosts: dc01
  vars:
    action: "{{ action }}" # extra-vars
  vars_files:
    - ../../vars/breakingbad.json

  roles:
    - role: ../../roles/vulnerabilities/anonymous-logon/enable
      when: action == 'enable'

    - role: ../../roles/vulnerabilities/anonymous-logon/disable
      when: action == 'disable'
  gather_facts: false