- name: IPv6 poisoning
  hosts: "{{ host_name | default('srv02', true) }}" # extra-vars
  vars:
    action: "{{ action }}" # extra-vars
    
  roles:
    - role: ../../roles/vulnerabilities/ipv6/enable
      when: action == "enable"

    - role: ../../roles/vulnerabilities/ipv6/disable
      when: action == "disable"

    - role: ../../roles/vulnerabilities/ipv6/trigger
      when: action == "trigger"
  gather_facts: false