- name: WebClient
  hosts: "{{ host_name | default('srv02') }}" # extra-vars
  vars:
    action: "{{ action }}" # extra-vars

  roles:
    - role: ../../roles/vulnerabilities/webclient/enable
      when: action == "enable"

    - role: ../../roles/vulnerabilities/webclient/disable
      when: action == "disable"
  gather_facts: false